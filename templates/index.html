<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemstone Price Predictor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; color: #111; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .wrap { background: #fff; border-radius: 12px; border: 1px solid #e5e5e5; padding: 2rem; width: 100%; max-width: 540px; }
    h1 { font-size: 22px; font-weight: 500; margin-bottom: 4px; }
    p.sub { font-size: 14px; color: #666; margin-bottom: 1.5rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field.full { grid-column: 1 / -1; }
    label { font-size: 13px; color: #555; }
    input, select {
      height: 38px; border-radius: 8px; border: 1px solid #ddd;
      background: #fafafa; color: #111; padding: 0 10px;
      font-size: 14px; width: 100%;
    }
    input:focus, select:focus { outline: none; border-color: #aaa; background: #fff; }
    button {
      width: 100%; height: 42px; margin-top: 8px;
      border: 1px solid #ddd; border-radius: 8px;
      background: #111; color: #fff;
      font-size: 15px; font-weight: 500; cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #333; }
    button:disabled { background: #999; cursor: not-allowed; }
    .result {
      margin-top: 1.5rem; padding: 1rem 1.25rem;
      border-radius: 10px; border: 1px solid #e5e5e5;
      background: #f9f9f9; display: none;
    }
    .result-label { font-size: 13px; color: #666; margin-bottom: 4px; }
    .result-value { font-size: 28px; font-weight: 500; }
    .error { color: #c0392b; font-size: 13px; margin-top: 8px; display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Gemstone Price Predictor</h1>
    <p class="sub">Enter the gemstone details to get an estimated price.</p>

    <div class="grid">
      <div class="field">
        <label for="carat">Carat</label>
        <input type="number" id="carat" placeholder="0.5" step="0.01" min="0">
      </div>
      <div class="field">
        <label for="cut">Cut</label>
        <select id="cut">
          <option value="">Select cut</option>
          <option>Fair</option><option>Good</option><option>Very Good</option>
          <option>Premium</option><option>Ideal</option>
        </select>
      </div>
      <div class="field">
        <label for="color">Color</label>
        <select id="color">
          <option value="">Select color</option>
          <option>D</option><option>E</option><option>F</option>
          <option>G</option><option>H</option><option>I</option><option>J</option>
        </select>
      </div>
      <div class="field">
        <label for="clarity">Clarity</label>
        <select id="clarity">
          <option value="">Select clarity</option>
          <option>I1</option><option>SI2</option><option>SI1</option>
          <option>VS2</option><option>VS1</option><option>VVS2</option>
          <option>VVS1</option><option>IF</option>
        </select>
      </div>
      <div class="field">
        <label for="depth">Depth (%)</label>
        <input type="number" id="depth" placeholder="61.5" step="0.1" min="0">
      </div>
      <div class="field">
        <label for="table">Table (%)</label>
        <input type="number" id="table" placeholder="55.0" step="0.1" min="0">
      </div>
      <div class="field">
        <label for="x">Length x (mm)</label>
        <input type="number" id="x" placeholder="5.0" step="0.01" min="0">
      </div>
      <div class="field">
        <label for="y">Width y (mm)</label>
        <input type="number" id="y" placeholder="5.0" step="0.01" min="0">
      </div>
      <div class="field full">
        <label for="z">Height z (mm)</label>
        <input type="number" id="z" placeholder="3.0" step="0.01" min="0">
      </div>
    </div>

    <button onclick="predict()">Predict Price</button>
    <p class="error" id="err"></p>

    <div class="result" id="result">
      <p class="result-label">Estimated price</p>
      <p class="result-value" id="price"></p>
    </div>
  </div>

  <script>
    async function predict() {
      const fields = { carat:'carat', cut:'cut', color:'color', clarity:'clarity',
                       depth:'depth', table:'table', x:'x', y:'y', z:'z' };
      const data = {};
      for (const [key, id] of Object.entries(fields)) {
        const val = document.getElementById(id).value;
        if (!val) { showErr('Please fill in all fields.'); return; }
        data[key] = ['cut','color','clarity'].includes(key) ? val : parseFloat(val);
      }
      document.getElementById('err').style.display = 'none';
      const btn = document.querySelector('button');
      btn.textContent = 'Predicting...';
      btn.disabled = true;
      try {
        const res = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const json = await res.json();
        if (!res.ok) { showErr('Prediction failed. Check your inputs.'); return; }
        const price = parseFloat(json.prediction).toLocaleString('en-US', {
          style: 'currency', currency: 'USD', maximumFractionDigits: 2
        });
        document.getElementById('price').textContent = price;
        document.getElementById('result').style.display = 'block';
      } catch(e) {
        showErr('Could not connect to the server.');
      } finally {
        btn.textContent = 'Predict Price';
        btn.disabled = false;
      }
    }

    function showErr(msg) {
      const el = document.getElementById('err');
      el.textContent = msg;
      el.style.display = 'block';
    }
  </script>
</body>
</html>
